{{define "partials/sync_status.html"}}
<div id="sync-panel" class="sync-panel">
  <div><strong>Sync state:</strong> <span class="pill {{.State}}">{{.State}}</span></div>
  {{if .ModList}}<div><strong>Mods:</strong> <code>{{.ModList}}</code></div>{{end}}
  {{if eq .State "needs_guard"}}
  <form hx-post="/mods/steam-guard" hx-target="#sync-panel" hx-swap="outerHTML">
    <label>Steam Guard code <input name="steam_guard_code" required autocomplete="one-time-code"></label>
    <button type="submit">Submit code</button>
  </form>
  {{end}}
  {{if .Error}}<div class="flash err">{{.Error}}</div>{{end}}
  {{if eq .State "done"}}
  <div class="flash ok">Sync complete. Restart the server to load new mods.</div>
  <form hx-post="/server/restart" hx-target="#status-panel" hx-swap="innerHTML">
    <button type="submit" class="warn">Restart server</button>
  </form>
  {{end}}
  <div class="logbox">
    {{range .Lines}}<div>{{.}}</div>{{end}}
  </div>
</div>
{{end}}
