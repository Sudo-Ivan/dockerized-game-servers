{{define "logs.html"}}
{{template "head" .}}
{{template "nav" .}}
<section class="card">
  <h2>Logs</h2>
  <form class="actions" method="get" action="/logs">
    <label>Source
      <select name="source">
        <option value="">All</option>
        <option value="process" {{if eq .Source "process"}}selected{{end}}>Process</option>
        <option value="rpt" {{if eq .Source "rpt"}}selected{{end}}>RPT</option>
        <option value="battleye" {{if eq .Source "battleye"}}selected{{end}}>BattlEye</option>
      </select>
    </label>
    <label>Filter
      <select name="filter">
        <option value="">None</option>
        <option value="error" {{if eq .Filter "error"}}selected{{end}}>Errors</option>
        <option value="script" {{if eq .Filter "script"}}selected{{end}}>Script</option>
        <option value="admin" {{if eq .Filter "admin"}}selected{{end}}>Admin</option>
      </select>
    </label>
    <button type="submit">Apply</button>
  </form>
  {{if .Err}}<div class="flash err">{{.Err}}</div>{{end}}
  <div id="log-lines">
    {{template "partials/log_lines.html" .}}
  </div>
</section>
{{template "foot" .}}
{{end}}
