services:
  vintage-story:
    image: ghcr.io/${IMAGE_OWNER}/vintage-story:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ghcr.io/${IMAGE_OWNER}/runtime-base:latest
    pull_policy: missing
    container_name: vintage-story
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    ports:
      - "42420:42420/tcp"
      - "42420:42420/udp"
    volumes:
      - ./data:/opt/vintage-story/data
    environment:
      VS_VERSION: "1.21.5"
      VS_BRANCH: "stable"
      VS_FORCE_UPDATE: "${VS_FORCE_UPDATE:-false}"
      SERVER_NAME: "Vintage Story Server"
      SERVER_DESCRIPTION: "Vintage Story dedicated server"
      SERVER_MOTD: "Welcome {0}, may you survive well and prosper"
      SERVER_PASSWORD: ""
      MAX_PLAYERS: "16"
      PORT: "42420"
      BIND: "0.0.0.0"
      ADVERTISE_SERVER: "false"
      VS_EXTRA_ARGS: ""
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 6144M
