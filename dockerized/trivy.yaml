# Shared Trivy settings for CI and local scans.

severity:
  - HIGH
  - CRITICAL

scan:
  skip-dirs:
    - "**/data"
    - "**/.git"
  skip-files:
    # Arch libcap diagnostic binary. Unused by game servers. Go stdlib HIGH noise.
    - "**/usr/bin/captree"

misconfiguration:
  scanners:
    - dockerfile
