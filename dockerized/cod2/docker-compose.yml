services:
  cod2:
    image: ghcr.io/${IMAGE_OWNER}/cod2:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ghcr.io/${IMAGE_OWNER}/runtime-base:latest
    pull_policy: missing
    container_name: cod2
    restart: unless-stopped
    stop_grace_period: 60s
    init: true
    ports:
      - "28960:28960/udp"
    volumes:
      - ./data:/opt/cod2
    environment:
      COD2_PORT: "28960"
      COD2_MAXPLAYERS: "20"
      COD2_STARTMAP: "mp_leningrad"
      COD2_HOSTNAME: "Call of Duty 2 Server"
      COD2_EXTRA_ARGS: ""
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1024M
