services:
  pumpkin:
    image: ghcr.io/${IMAGE_OWNER}/pumpkin:latest
    build:
      context: .
      dockerfile: Containerfile
      args:
        BASE_IMAGE: ghcr.io/${IMAGE_OWNER}/runtime-base:latest
    pull_policy: missing
    container_name: pumpkin
    restart: unless-stopped
    stop_grace_period: 60s
    init: true
    ports:
      - "25565:25565/tcp"
      - "19132:19132/udp"
      - "19133:19133/udp"
    volumes:
      - ./data:/data
    environment:
      PUMPKIN_PORT: "25565"
      PUMPKIN_BEDROCK: "true"
      PUMPKIN_BEDROCK_PORT: "19132"
      PUMPKIN_MOTD: "A blazingly fast Pumpkin server!"
      PUMPKIN_MAX_PLAYERS: "1000"
      PUMPKIN_ONLINE_MODE: "true"
      PUMPKIN_SEED: ""
      PUMPKIN_GAMEMODE: "Survival"
      PUMPKIN_DIFFICULTY: "Normal"
      PUMPKIN_EXTRA_ARGS: ""
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    mem_limit: 3072M
