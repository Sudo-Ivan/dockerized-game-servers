services:
  icarus:
    image: ghcr.io/${IMAGE_OWNER}/icarus:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ghcr.io/${IMAGE_OWNER}/steam-base:latest
    pull_policy: missing
    container_name: icarus
    restart: unless-stopped
    stop_grace_period: 180s
    init: true
    ports:
      - "17777:17777/udp"
      - "27015:27015/udp"
    volumes:
      - ./data:/opt/icarus
    environment:
      STEAM_USERNAME: "${STEAM_USERNAME:-anonymous}"
      STEAM_PASSWORD: "${STEAM_PASSWORD:-}"
      STEAM_GUARD_CODE: "${STEAM_GUARD_CODE:-}"
      ICARUS_APP_ID: "2089300"
      ICARUS_FORCE_UPDATE: "${ICARUS_FORCE_UPDATE:-false}"
      ICARUS_PORT: "17777"
      ICARUS_QUERY_PORT: "27015"
      ICARUS_GAME_MODE: "Prospect"
      ICARUS_SESSION_NAME: "Icarus Server"
      ICARUS_MAX_PLAYERS: "8"
      ICARUS_ADMIN_PASSWORD: ""
      ICARUS_EXTRA_ARGS: ""
      WINEPREFIX: "/opt/icarus/.wine"
      WINEARCH: "win64"
      WINEDEBUG: "-all"
      SteamAppId: "1149460"
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 1200s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 8192M
