services:
  dayz:
    image: ghcr.io/${IMAGE_OWNER}/dayz:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ghcr.io/${IMAGE_OWNER}/steam-base:latest
    pull_policy: missing
    container_name: dayz
    restart: unless-stopped
    stop_grace_period: 120s
    init: true
    ports:
      - "2302:2302/udp"
      - "2303:2303/udp"
      - "2304:2304/udp"
      - "2305:2305/udp"
      - "2306:2306/udp"
    volumes:
      - ./data:/opt/dayz
    environment:
      STEAM_USERNAME: "${STEAM_USERNAME:-}"
      STEAM_PASSWORD: "${STEAM_PASSWORD:-}"
      STEAM_GUARD_CODE: "${STEAM_GUARD_CODE:-}"
      DAYZ_APP_ID: "223350"
      DAYZ_FORCE_UPDATE: "${DAYZ_FORCE_UPDATE:-false}"
      DAYZ_PORT: "2302"
      DAYZ_HOSTNAME: "DayZ Server"
      DAYZ_MAX_PLAYERS: "60"
      DAYZ_EXTRA_ARGS: ""
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 1200s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 6144M
