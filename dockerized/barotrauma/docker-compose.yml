services:
  barotrauma:
    image: ghcr.io/${IMAGE_OWNER}/barotrauma:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ghcr.io/${IMAGE_OWNER}/steam-base:latest
    pull_policy: missing
    container_name: barotrauma
    restart: unless-stopped
    stop_grace_period: 120s
    init: true
    ports:
      - "27015:27015/udp"
      - "27016:27016/udp"
    volumes:
      - ./data:/opt/barotrauma
    environment:
      STEAM_USERNAME: "${STEAM_USERNAME:-anonymous}"
      STEAM_PASSWORD: "${STEAM_PASSWORD:-}"
      STEAM_GUARD_CODE: "${STEAM_GUARD_CODE:-}"
      BAROTRAUMA_APP_ID: "1026340"
      BAROTRAUMA_FORCE_UPDATE: "${BAROTRAUMA_FORCE_UPDATE:-false}"
      BAROTRAUMA_EXTRA_ARGS: ""
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 600s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    mem_limit: 4096M
