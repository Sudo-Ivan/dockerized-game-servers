services:
  rtcw:
    image: ghcr.io/${IMAGE_OWNER}/rtcw:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ghcr.io/${IMAGE_OWNER}/runtime-base:latest
    pull_policy: missing
    container_name: rtcw
    restart: unless-stopped
    stop_grace_period: 60s
    init: true
    ports:
      - "27960:27960/udp"
    volumes:
      - ./data:/opt/rtcw
    environment:
      RTCW_PORT: "27960"
      RTCW_MAXPLAYERS: "32"
      RTCW_STARTMAP: "mp_beach"
      RTCW_HOSTNAME: "Return to Castle Wolfenstein Server"
      RTCW_EXTRA_ARGS: ""
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768M
