services:
  delta-force-bhd:
    image: ghcr.io/${IMAGE_OWNER}/delta-force-bhd:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ghcr.io/${IMAGE_OWNER}/steam-base:latest
    pull_policy: missing
    container_name: delta-force-bhd
    restart: unless-stopped
    stop_grace_period: 60s
    init: true
    ports:
      - "3568:3568/udp"
    volumes:
      - ./data:/opt/dfbhd
    environment:
      BHD_EXTRA_ARGS: ""
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    mem_limit: 2048M
