services:
  cod:
    image: ghcr.io/${IMAGE_OWNER}/cod:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ghcr.io/${IMAGE_OWNER}/runtime-base:latest
    pull_policy: missing
    container_name: cod
    restart: unless-stopped
    stop_grace_period: 60s
    init: true
    ports:
      - "28960:28960/udp"
    volumes:
      - ./data:/opt/cod
    environment:
      COD_PORT: "28960"
      COD_MAXPLAYERS: "20"
      COD_STARTMAP: "mp_neuville"
      COD_HOSTNAME: "Call of Duty Server"
      COD_EXTRA_ARGS: ""
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1024M
