services:
  rtcwcoop:
    image: ghcr.io/${IMAGE_OWNER}/rtcwcoop:latest
    build:
      context: .
      dockerfile: Containerfile
      args:
        BASE_IMAGE: ghcr.io/${IMAGE_OWNER}/runtime-base:latest
    pull_policy: missing
    container_name: rtcwcoop
    restart: unless-stopped
    stop_grace_period: 60s
    init: true
    ports:
      - "27960:27960/udp"
    volumes:
      - ./data:/opt/rtcwcoop
    environment:
      RTCWCOOP_PORT: "27960"
      RTCWCOOP_MAXPLAYERS: "8"
      RTCWCOOP_STARTMAP: "escape1"
      RTCWCOOP_HOSTNAME: "RTCWCoop Campaign Server"
      RTCWCOOP_EXTRA_ARGS: ""
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    mem_limit: 1024M
