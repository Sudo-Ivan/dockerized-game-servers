services:
  starbound:
    image: ghcr.io/${IMAGE_OWNER}/starbound:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ghcr.io/${IMAGE_OWNER}/steam-base:latest
    pull_policy: missing
    container_name: starbound
    restart: unless-stopped
    stop_grace_period: 90s
    init: true
    ports:
      - "21025:21025/tcp"
    volumes:
      - ./data:/opt/starbound
    environment:
      STEAM_USERNAME: "${STEAM_USERNAME:-anonymous}"
      STEAM_PASSWORD: "${STEAM_PASSWORD:-}"
      STEAM_GUARD_CODE: "${STEAM_GUARD_CODE:-}"
      STARBOUND_APP_ID: "211820"
      STARBOUND_FORCE_UPDATE: "${STARBOUND_FORCE_UPDATE:-false}"
      STARBOUND_PORT: "21025"
      STARBOUND_BIND: "0.0.0.0"
      STARBOUND_EXTRA_ARGS: ""
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 600s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2048M
