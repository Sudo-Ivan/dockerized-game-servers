services:
  palworld:
    image: ghcr.io/${IMAGE_OWNER}/palworld:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ghcr.io/${IMAGE_OWNER}/steam-base:latest
    pull_policy: missing
    container_name: palworld
    restart: unless-stopped
    stop_grace_period: 120s
    init: true
    ports:
      - "8211:8211/udp"
    volumes:
      - ./data:/opt/palworld
    environment:
      STEAM_USERNAME: "${STEAM_USERNAME:-anonymous}"
      STEAM_PASSWORD: "${STEAM_PASSWORD:-}"
      STEAM_GUARD_CODE: "${STEAM_GUARD_CODE:-}"
      PALWORLD_APP_ID: "2394010"
      PALWORLD_FORCE_UPDATE: "${PALWORLD_FORCE_UPDATE:-false}"
      PALWORLD_PORT: "8211"
      PALWORLD_PLAYERS: "32"
      PALWORLD_EXTRA_ARGS: ""
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 900s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 8192M
