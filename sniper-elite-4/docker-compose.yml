services:
  sniper-elite-4:
    image: ghcr.io/${IMAGE_OWNER}/sniper-elite-4:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ghcr.io/${IMAGE_OWNER}/steam-base:latest
    pull_policy: missing
    container_name: sniper-elite-4
    restart: unless-stopped
    stop_grace_period: 60s
    init: true
    ports:
      - "27000:27000/udp"
      - "27005:27005/udp"
      - "27010:27010/tcp"
      - "27015:27015/udp"
    volumes:
      - ./data:/opt/se4
    environment:
      STEAM_USERNAME: "${STEAM_USERNAME:-anonymous}"
      STEAM_PASSWORD: "${STEAM_PASSWORD:-}"
      STEAM_GUARD_CODE: "${STEAM_GUARD_CODE:-}"
      SE4_APP_ID: "568880"
      SE4_STEAM_APP_ID: "312660"
      SE4_FORCE_UPDATE: "${SE4_FORCE_UPDATE:-false}"
      SE4_AUTH_PORT: "27000"
      SE4_GAME_PORT: "27005"
      SE4_LOBBY_PORT: "27010"
      SE4_UPDATE_PORT: "27015"
      SE4_SERVER_NAME: "Sniper Elite 4 Server"
      SE4_MAX_PLAYERS: "12"
      SE4_MAP_ROTATION: "VILLAGE:DM,RIVIERA:DM,COMPOUND:DM,RAILYARD:DM,DOCKYARD:DM"
      SE4_EXTRA_ARGS: ""
      WINEPREFIX: "/opt/se4/.wine"
      WINEARCH: "win64"
      WINEDEBUG: "-all"
      SteamAppId: "312660"
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2048M
