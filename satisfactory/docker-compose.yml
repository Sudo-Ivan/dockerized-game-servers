services:
  satisfactory:
    image: ghcr.io/${IMAGE_OWNER}/satisfactory:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ghcr.io/${IMAGE_OWNER}/steam-base:latest
    pull_policy: missing
    container_name: satisfactory
    restart: unless-stopped
    stop_grace_period: 120s
    init: true
    ports:
      - "7777:7777/tcp"
      - "7777:7777/udp"
      - "8888:8888/tcp"
    volumes:
      - ./data:/opt/satisfactory
    environment:
      STEAM_USERNAME: "${STEAM_USERNAME:-anonymous}"
      STEAM_PASSWORD: "${STEAM_PASSWORD:-}"
      STEAM_GUARD_CODE: "${STEAM_GUARD_CODE:-}"
      SATISFACTORY_APP_ID: "1690800"
      SATISFACTORY_FORCE_UPDATE: "${SATISFACTORY_FORCE_UPDATE:-false}"
      SATISFACTORY_PORT: "7777"
      SATISFACTORY_RELIABLE_PORT: "8888"
      SATISFACTORY_EXTRA_ARGS: ""
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 900s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    mem_limit: 8192M
