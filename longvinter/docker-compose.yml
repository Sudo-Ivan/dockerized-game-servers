services:
  longvinter:
    image: ghcr.io/${IMAGE_OWNER}/longvinter:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ghcr.io/${IMAGE_OWNER}/steam-base:latest
    pull_policy: missing
    container_name: longvinter
    restart: unless-stopped
    stop_grace_period: 120s
    init: true
    ports:
      - "7777:7777/udp"
    volumes:
      - ./data:/opt/longvinter
    environment:
      STEAM_USERNAME: "${STEAM_USERNAME:-anonymous}"
      STEAM_PASSWORD: "${STEAM_PASSWORD:-}"
      STEAM_GUARD_CODE: "${STEAM_GUARD_CODE:-}"
      LONGVINTER_APP_ID: "1639880"
      LONGVINTER_FORCE_UPDATE: "${LONGVINTER_FORCE_UPDATE:-false}"
      LONGVINTER_PORT: "7777"
      LONGVINTER_SERVER_NAME: "Longvinter Server"
      LONGVINTER_SERVER_MOTD: "Welcome to Longvinter!"
      LONGVINTER_MAX_PLAYERS: "32"
      LONGVINTER_PASSWORD: ""
      LONGVINTER_COMMUNITY_WEBSITE: "discord.gg/longvinter"
      LONGVINTER_ADMIN_STEAM_ID: ""
      LONGVINTER_PVP: "true"
      LONGVINTER_TENT_DECAY: "true"
      LONGVINTER_MAX_TENTS: "3"
      LONGVINTER_RESTART_TIME_24H: "6"
      LONGVINTER_SAVE_BACKUPS: "true"
      LONGVINTER_EXTRA_ARGS: ""
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 600s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    mem_limit: 4096M
