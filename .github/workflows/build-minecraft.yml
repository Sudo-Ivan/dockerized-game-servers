name: build-minecraft

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Minecraft image flavor
        type: choice
        options:
          - fabric
          - vanilla
          - forge
        default: fabric
      minecraft_version:
        description: Minecraft version (for example 26.2 or 1.21.8)
        type: string
        required: true
      fabric_loader_version:
        description: Fabric loader (empty = latest stable for that MC version)
        type: string
        required: false
        default: ""
      fabric_installer_version:
        description: Fabric installer (empty = latest stable)
        type: string
        required: false
        default: ""
      forge_version:
        description: Forge version (empty = promo channel below)
        type: string
        required: false
        default: ""
      forge_channel:
        description: Forge promo channel when forge_version is empty
        type: choice
        options:
          - recommended
          - latest
        default: recommended
      java_major:
        description: Override Java major (empty = Mojang javaVersion for that MC release)
        type: string
        required: false
        default: ""
      tag:
        description: Image tag (empty = MC version, or MC-forge for Forge)
        type: string
        required: false
        default: ""
      also_tag_latest:
        description: Also tag the game image as latest
        type: boolean
        default: false
      push:
        description: Push images to GHCR
        type: boolean
        default: true

concurrency:
  group: build-minecraft-${{ github.ref }}-${{ inputs.flavor }}-${{ inputs.minecraft_version }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  actions: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository }}
  GITHUB_REPOSITORY: ${{ github.repository }}
  PLATFORM: linux/amd64
  PUSH: ${{ inputs.push && 'true' || 'false' }}

jobs:
  build:
    name: ${{ inputs.flavor }} / ${{ inputs.minecraft_version }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve versions and Java
        id: resolve
        env:
          INPUT_FLAVOR: ${{ inputs.flavor }}
          INPUT_MINECRAFT_VERSION: ${{ inputs.minecraft_version }}
          INPUT_FABRIC_LOADER_VERSION: ${{ inputs.fabric_loader_version }}
          INPUT_FABRIC_INSTALLER_VERSION: ${{ inputs.fabric_installer_version }}
          INPUT_FORGE_VERSION: ${{ inputs.forge_version }}
          INPUT_FORGE_CHANNEL: ${{ inputs.forge_channel }}
          INPUT_JAVA_MAJOR: ${{ inputs.java_major }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          chmod +x ci/resolve-minecraft-build.sh
          ./ci/resolve-minecraft-build.sh \
            --flavor "${INPUT_FLAVOR}" \
            --minecraft-version "${INPUT_MINECRAFT_VERSION}" \
            --fabric-loader-version "${INPUT_FABRIC_LOADER_VERSION}" \
            --fabric-installer-version "${INPUT_FABRIC_INSTALLER_VERSION}" \
            --forge-version "${INPUT_FORGE_VERSION}" \
            --forge-channel "${INPUT_FORGE_CHANNEL}" \
            --java-major "${INPUT_JAVA_MAJOR}" \
            --tag "${INPUT_TAG}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write Temurin build args
        env:
          TEMURIN_MAJOR: ${{ steps.resolve.outputs.TEMURIN_MAJOR }}
          TEMURIN_VERSION: ${{ steps.resolve.outputs.TEMURIN_VERSION }}
          TEMURIN_RELEASE: ${{ steps.resolve.outputs.TEMURIN_RELEASE }}
        run: |
          {
            echo "TEMURIN_MAJOR=${TEMURIN_MAJOR}"
            echo "TEMURIN_VERSION=${TEMURIN_VERSION}"
            echo "TEMURIN_RELEASE=${TEMURIN_RELEASE}"
          } > /tmp/mc-base.args

      - name: Build minecraft-base
        env:
          TAG: ${{ steps.resolve.outputs.BASE_TAG }}
          BUILD_ARGS_FILE: /tmp/mc-base.args
        run: |
          chmod +x ci/*.sh
          ./ci/build-image.sh \
            minecraft-base \
            bases/minecraft \
            bases/minecraft/Dockerfile

      - name: Write game build args
        env:
          FLAVOR: ${{ steps.resolve.outputs.FLAVOR }}
          MINECRAFT_VERSION: ${{ steps.resolve.outputs.MINECRAFT_VERSION }}
          FABRIC_LOADER_VERSION: ${{ steps.resolve.outputs.FABRIC_LOADER_VERSION }}
          FABRIC_INSTALLER_VERSION: ${{ steps.resolve.outputs.FABRIC_INSTALLER_VERSION }}
          FORGE_VERSION: ${{ steps.resolve.outputs.FORGE_VERSION }}
        run: |
          case "${FLAVOR}" in
            fabric)
              {
                echo "FABRIC_MINECRAFT_VERSION=${MINECRAFT_VERSION}"
                echo "FABRIC_LOADER_VERSION=${FABRIC_LOADER_VERSION}"
                echo "FABRIC_INSTALLER_VERSION=${FABRIC_INSTALLER_VERSION}"
              } > /tmp/mc-game.args
              echo "DOCKERFILE=minecraft/fabric/Dockerfile" >> "${GITHUB_ENV}"
              ;;
            vanilla)
              {
                echo "VANILLA_VERSION=${MINECRAFT_VERSION}"
              } > /tmp/mc-game.args
              echo "DOCKERFILE=minecraft/vanilla/Dockerfile" >> "${GITHUB_ENV}"
              ;;
            forge)
              {
                echo "FORGE_MINECRAFT_VERSION=${MINECRAFT_VERSION}"
                echo "FORGE_VERSION=${FORGE_VERSION}"
              } > /tmp/mc-game.args
              echo "DOCKERFILE=minecraft/forge/Dockerfile" >> "${GITHUB_ENV}"
              ;;
            *)
              echo "unknown flavor: ${FLAVOR}" >&2
              exit 1
              ;;
          esac

      - name: Build game image
        env:
          TAG: ${{ steps.resolve.outputs.IMAGE_TAG }}
          BUILD_ARGS_FILE: /tmp/mc-game.args
          EXTRA_TAGS: ${{ inputs.also_tag_latest && 'latest' || '' }}
          BASE_TAG: ${{ steps.resolve.outputs.BASE_TAG }}
          IMAGE_NAME: ${{ steps.resolve.outputs.IMAGE_NAME }}
        run: |
          eval "$(./ci/repo-meta.sh)"
          export IMAGE_OWNER
          base_image="${REGISTRY}/${IMAGE_OWNER}/minecraft-base:${BASE_TAG}"
          ./ci/build-image.sh \
            "${IMAGE_NAME}" \
            minecraft \
            "${DOCKERFILE}" \
            "${base_image}"

      - name: Scan images
        if: env.PUSH == 'true'
        env:
          BASE_TAG: ${{ steps.resolve.outputs.BASE_TAG }}
          IMAGE_TAG: ${{ steps.resolve.outputs.IMAGE_TAG }}
          IMAGE_NAME: ${{ steps.resolve.outputs.IMAGE_NAME }}
        run: |
          eval "$(./ci/repo-meta.sh)"
          ./ci/trivy-image.sh \
            "${REGISTRY}/${IMAGE_OWNER}/minecraft-base:${BASE_TAG}"
          ./ci/trivy-image.sh \
            "${REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}:${IMAGE_TAG}"
