name: build

on:
  schedule:
    # Weekly rebuild for Arch package refresh and GHCR republish.
    - cron: "0 6 * * 0"
  push:
    branches:
      - master
      - main
    paths:
      - "bases/**"
      - "**/Dockerfile"
      - "ci/**"
      - "trivy.yaml"
      - ".trivyignore"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      push:
        description: Push images to GHCR
        type: boolean
        default: true
      tag:
        description: Image tag
        type: string
        default: latest

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository }}
  GITHUB_REPOSITORY: ${{ github.repository }}
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'latest' }}
  PUSH: ${{ github.event_name != 'workflow_dispatch' && 'true' || (inputs.push && 'true' || 'false') }}
  PLATFORM: linux/amd64

jobs:
  bases:
    name: base / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minecraft-base
            context: bases/minecraft
            dockerfile: bases/minecraft/Dockerfile
          - name: steam-base
            context: bases/steam
            dockerfile: bases/steam/Dockerfile
          - name: runtime-base
            context: bases/runtime
            dockerfile: bases/runtime/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base
        env:
          PUSH: "true"
        run: |
          chmod +x ci/*.sh
          eval "$(./ci/repo-meta.sh)"
          export IMAGE_OWNER
          ./ci/build-image.sh \
            "${{ matrix.name }}" \
            "${{ matrix.context }}" \
            "${{ matrix.dockerfile }}"

      - name: Scan image with pinned Trivy CLI
        run: |
          eval "$(./ci/repo-meta.sh)"
          ./ci/trivy-image.sh \
            "${REGISTRY}/${IMAGE_OWNER}/${{ matrix.name }}:${TAG}"

  images:
    name: image / ${{ matrix.name }}
    needs: bases
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minecraft-fabric
            context: minecraft
            dockerfile: minecraft/fabric/Dockerfile
            base: minecraft-base
          - name: minecraft-vanilla
            context: minecraft
            dockerfile: minecraft/vanilla/Dockerfile
            base: minecraft-base
          - name: minecraft-forge
            context: minecraft
            dockerfile: minecraft/forge/Dockerfile
            base: minecraft-base
          - name: valheim
            context: valheim/vanilla
            dockerfile: valheim/vanilla/Dockerfile
            base: steam-base
          - name: valheim-plus
            context: valheim/plus
            dockerfile: valheim/plus/Dockerfile
            base: steam-base
          - name: ground-branch
            context: ground-branch
            dockerfile: ground-branch/Dockerfile
            base: steam-base
          - name: core-keeper
            context: core-keeper
            dockerfile: core-keeper/Dockerfile
            base: steam-base
          - name: factorio
            context: factorio
            dockerfile: factorio/Dockerfile
            base: runtime-base
          - name: 7-days-to-die
            context: 7-days-to-die
            dockerfile: 7-days-to-die/Dockerfile
            base: steam-base
          - name: project-zomboid
            context: project-zomboid
            dockerfile: project-zomboid/Dockerfile
            base: steam-base
          - name: terraria
            context: terraria
            dockerfile: terraria/Dockerfile
            base: steam-base
          - name: openmohaa
            context: openmohaa
            dockerfile: openmohaa/Dockerfile
            base: runtime-base
          - name: arma-3
            context: arma/arma-3
            dockerfile: arma/arma-3/Dockerfile
            base: steam-base
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        env:
          PUSH: "true"
        run: |
          chmod +x ci/*.sh
          eval "$(./ci/repo-meta.sh)"
          export IMAGE_OWNER
          base_image="${REGISTRY}/${IMAGE_OWNER}/${{ matrix.base }}:${TAG}"
          ./ci/build-image.sh \
            "${{ matrix.name }}" \
            "${{ matrix.context }}" \
            "${{ matrix.dockerfile }}" \
            "${base_image}"

      - name: Scan image with pinned Trivy CLI
        run: |
          eval "$(./ci/repo-meta.sh)"
          ./ci/trivy-image.sh \
            "${REGISTRY}/${IMAGE_OWNER}/${{ matrix.name }}:${TAG}"
