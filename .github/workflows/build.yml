name: build

on:
  schedule:
    # Weekly rebuild for Arch package refresh and GHCR republish.
    - cron: "0 6 * * 0"
  push:
    branches:
      - master
      - main
    paths:
      - "dockerized/bases/**"
      - "**/Dockerfile"
      - "ci/**"
      - "dockerized/trivy.yaml"
      - "dockerized/.trivyignore"
      - ".github/workflows/build.yml"
      - ".github/workflows/docker-image.yml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      push:
        description: Push images to GHCR
        type: boolean
        default: true
      tag:
        description: Image tag
        type: string
        default: latest

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  actions: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository }}
  GITHUB_REPOSITORY: ${{ github.repository }}
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'latest' }}
  PUSH: ${{ github.event_name != 'workflow_dispatch' && 'true' || (inputs.push && 'true' || 'false') }}
  PLATFORM: linux/amd64

jobs:
  matrix:
    name: prepare matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      bases: ${{ steps.set.outputs.bases }}
      images: ${{ steps.set.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve image matrix
        id: set
        run: |
          bases="$(python3 ci/github-matrix.py bases)"
          images="$(python3 ci/github-matrix.py images)"
          {
            echo "bases<<EOF"
            echo "${bases}"
            echo "EOF"
            echo "images<<EOF"
            echo "${images}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

  bases:
    name: base / ${{ matrix.name }}
    needs: matrix
    permissions:
      contents: read
      packages: write
      actions: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.bases) }}
    uses: ./.github/workflows/docker-image.yml
    with:
      name: ${{ matrix.name }}
      push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'latest' }}
      scan: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}

  images:
    name: image / ${{ matrix.name }}
    needs:
      - matrix
      - bases
    permissions:
      contents: read
      packages: write
      actions: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.images) }}
    uses: ./.github/workflows/docker-image.yml
    with:
      name: ${{ matrix.name }}
      push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'latest' }}
      scan: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
