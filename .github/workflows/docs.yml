name: docs

on:
  push:
    branches:
      - master
      - main
    paths:
      - "docs/**"
      - "ci/repo-meta.sh"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "ci/repo-meta.sh"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve site identity
        id: meta
        run: |
          chmod +x ci/repo-meta.sh
          eval "$(./ci/repo-meta.sh)"
          {
            echo "site_url=${SITE_URL}"
            echo "site_base=${SITE_BASE}"
            echo "github_url=${GITHUB_URL}"
            echo "image_prefix=${IMAGE_PREFIX}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        working-directory: docs
        run: pnpm audit --prod

      - name: Build site
        working-directory: docs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          SITE_URL: ${{ steps.meta.outputs.site_url }}
          SITE_BASE: ${{ steps.meta.outputs.site_base }}
        run: pnpm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    name: deploy
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
