name: docs

on:
  push:
    branches:
      - master
      - main
    paths:
      - "docs/**"
      - "overrides/**"
      - "zensical.toml"
      - "macros.yml"
      - "ci/fetch-game-icons.py"
      - "ci/check-doc-catalog.py"
      - "ci/test-docs.sh"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "overrides/**"
      - "zensical.toml"
      - "macros.yml"
      - "ci/fetch-game-icons.py"
      - "ci/check-doc-catalog.py"
      - "ci/test-docs.sh"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Zensical
        run: pip install zensical==0.0.68

      - name: Fetch game icons
        run: python3 ci/fetch-game-icons.py

      - name: Build site
        run: zensical build --strict --clean

      - name: Check doc catalog
        run: python3 ci/check-doc-catalog.py

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: deploy
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
