name: ci

on:
  push:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/docker-image.yml"
      - "ci/**"
      - "tools/**"
      - "bases/**"
      - "**/Dockerfile"
      - "**/docker-compose.yml"
      - "**/compose.yml"
      - "trivy.yaml"
      - ".trivyignore"
      - "**/*.sh"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/docker-image.yml"
      - "ci/**"
      - "tools/**"
      - "bases/**"
      - "**/Dockerfile"
      - "**/docker-compose.yml"
      - "**/compose.yml"
      - "trivy.yaml"
      - ".trivyignore"
      - "**/*.sh"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: detect changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect docker verify paths
        id: filter
        run: |
          chmod +x ci/changed-paths.sh
          if ./ci/changed-paths.sh docker-verify \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"; then
            echo "docker=true" >> "${GITHUB_OUTPUT}"
          else
            echo "docker=false" >> "${GITHUB_OUTPUT}"
          fi

  matrix:
    name: prepare matrix
    if: github.event_name == 'pull_request' && needs.changes.outputs.docker == 'true'
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      bases: ${{ steps.set.outputs.bases }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve image matrix
        id: set
        run: |
          bases="$(python3 ci/github-matrix.py bases)"
          {
            echo "bases<<EOF"
            echo "${bases}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

  check:
    name: repository checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run checks
        run: |
          chmod +x ci/*.sh tools/gs
          ./ci/ci-check.sh

  trivy-config:
    name: trivy / dockerfiles
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan Dockerfiles with pinned Trivy CLI
        run: |
          chmod +x ci/install-trivy.sh ci/trivy-config.sh
          ./ci/trivy-config.sh

  verify-bases:
    name: verify / ${{ matrix.name }}
    if: github.event_name == 'pull_request' && needs.changes.outputs.docker == 'true'
    needs:
      - changes
      - matrix
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.bases) }}
    uses: ./.github/workflows/docker-image.yml
    with:
      name: ${{ matrix.name }}
      push: false
      tag: ci
      scan: false
