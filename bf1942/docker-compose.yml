services:
  bf1942:
    image: ghcr.io/${IMAGE_OWNER}/bf1942:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ghcr.io/${IMAGE_OWNER}/runtime-base:latest
    container_name: bf1942
    restart: unless-stopped
    init: true
    ports:
      - "14567:14567/udp"
      - "23000:23000/tcp"
    volumes:
      - ./data:/opt/bf1942
    environment:
      BF1942_EXTRA_ARGS: ""
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1024M
