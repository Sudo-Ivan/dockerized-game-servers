services:
  gmod:
    image: ghcr.io/${IMAGE_OWNER}/gmod:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ghcr.io/${IMAGE_OWNER}/steam-base:latest
    pull_policy: missing
    container_name: gmod
    restart: unless-stopped
    stop_grace_period: 90s
    init: true
    ports:
      - "27015:27015/tcp"
      - "27015:27015/udp"
      - "27005:27005/udp"
    volumes:
      - ./data:/opt/gmod
    environment:
      STEAM_USERNAME: "${STEAM_USERNAME:-anonymous}"
      STEAM_PASSWORD: "${STEAM_PASSWORD:-}"
      STEAM_GUARD_CODE: "${STEAM_GUARD_CODE:-}"
      GMOD_APP_ID: "4020"
      GMOD_FORCE_UPDATE: "${GMOD_FORCE_UPDATE:-false}"
      STEAMCMD_WINDOWS_WORKAROUND: "full"
      GMOD_PORT: "27015"
      GMOD_CLIENT_PORT: "27005"
      GMOD_MAXPLAYERS: "16"
      GMOD_STARTMAP: "gm_flatgrass"
      GMOD_TICKRATE: "66"
      GMOD_GSLT: "${GMOD_GSLT:-}"
      GMOD_EXTRA_ARGS: ""
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 900s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    mem_limit: 4096M
