services:
  codwaw:
    image: ghcr.io/${IMAGE_OWNER}/codwaw:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ghcr.io/${IMAGE_OWNER}/runtime-base:latest
    pull_policy: missing
    container_name: codwaw
    restart: unless-stopped
    stop_grace_period: 60s
    init: true
    ports:
      - "28960:28960/udp"
    volumes:
      - ./data:/opt/codwaw
    environment:
      CODWAW_PORT: "28960"
      CODWAW_MAXPLAYERS: "20"
      CODWAW_STARTMAP: "mp_castle"
      CODWAW_HOSTNAME: "Call of Duty: World at War Server"
      CODWAW_EXTRA_ARGS: ""
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2048M
