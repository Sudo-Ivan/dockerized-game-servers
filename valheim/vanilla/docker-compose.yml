services:
  valheim:
    image: ghcr.io/${IMAGE_OWNER}/valheim:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ghcr.io/${IMAGE_OWNER}/steam-base:latest
    pull_policy: missing
    container_name: valheim
    restart: unless-stopped
    stop_grace_period: 90s
    init: true
    ports:
      - "2456:2456/udp"
      - "2457:2457/udp"
      - "2458:2458/udp"
    volumes:
      - ./data:/opt/valheim
    environment:
      STEAM_USERNAME: "anonymous"
      STEAM_PASSWORD: ""
      VALHEIM_APP_ID: "896660"
      VALHEIM_FORCE_UPDATE: "${VALHEIM_FORCE_UPDATE:-false}"
      SERVER_NAME: "Valheim Server"
      SERVER_PORT: "2456"
      WORLD_NAME: "Dedicated"
      SERVER_PASS: "${SERVER_PASS:-changeme}"
      SERVER_PUBLIC: "1"
      SERVER_LOGINTOKEN: ""
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 4096M
