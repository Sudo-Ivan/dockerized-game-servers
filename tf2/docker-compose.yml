services:
  tf2:
    image: ghcr.io/${IMAGE_OWNER}/tf2:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ghcr.io/${IMAGE_OWNER}/steam-base:latest
    pull_policy: missing
    container_name: tf2
    restart: unless-stopped
    stop_grace_period: 90s
    init: true
    ports:
      - "27015:27015/tcp"
      - "27015:27015/udp"
      - "27005:27005/udp"
    volumes:
      - ./data:/opt/tf2
    environment:
      STEAM_USERNAME: "${STEAM_USERNAME:-anonymous}"
      STEAM_PASSWORD: "${STEAM_PASSWORD:-}"
      STEAM_GUARD_CODE: "${STEAM_GUARD_CODE:-}"
      TF2_APP_ID: "232250"
      TF2_FORCE_UPDATE: "${TF2_FORCE_UPDATE:-false}"
      STEAMCMD_WINDOWS_WORKAROUND: "full"
      TF2_PORT: "27015"
      TF2_CLIENT_PORT: "27005"
      TF2_MAXPLAYERS: "24"
      TF2_STARTMAP: "cp_dustbowl"
      TF2_TICKRATE: "66"
      TF2_GSLT: "${TF2_GSLT:-}"
      TF2_EXTRA_ARGS: ""
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 900s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    mem_limit: 4096M
