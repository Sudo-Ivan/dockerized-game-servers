services:
  l4d2:
    image: ghcr.io/${IMAGE_OWNER}/l4d2:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ghcr.io/${IMAGE_OWNER}/steam-base:latest
    pull_policy: missing
    container_name: l4d2
    restart: unless-stopped
    stop_grace_period: 90s
    init: true
    ports:
      - "27015:27015/tcp"
      - "27015:27015/udp"
      - "27005:27005/udp"
    volumes:
      - ./data:/opt/l4d2
    environment:
      STEAM_USERNAME: "anonymous"
      STEAM_PASSWORD: ""
      L4D2_APP_ID: "222860"
      L4D2_FORCE_UPDATE: "${L4D2_FORCE_UPDATE:-false}"
      L4D2_PORT: "27015"
      L4D2_MAXPLAYERS: "8"
      L4D2_STARTMAP: "c1m1_hotel"
      L4D2_TICKRATE: "30"
      L4D2_EXTRA_ARGS: ""
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 600s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2048M
