services:
  insurgency-source:
    image: ghcr.io/${IMAGE_OWNER}/insurgency-source:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ghcr.io/${IMAGE_OWNER}/steam-base:latest
    pull_policy: missing
    container_name: insurgency-source
    restart: unless-stopped
    stop_grace_period: 90s
    init: true
    ports:
      - "27015:27015/tcp"
      - "27015:27015/udp"
      - "27016:27016/udp"
    volumes:
      - ./data:/opt/insurgency-source
    environment:
      STEAM_USERNAME: "anonymous"
      STEAM_PASSWORD: ""
      INS_SOURCE_APP_ID: "237410"
      INS_SOURCE_FORCE_UPDATE: "${INS_SOURCE_FORCE_UPDATE:-false}"
      INS_SOURCE_PORT: "27015"
      INS_SOURCE_CLIENT_PORT: "27016"
      INS_SOURCE_MAXPLAYERS: "16"
      INS_SOURCE_STARTMAP: "ministry"
      INS_SOURCE_TICKRATE: "128"
      INS_SOURCE_EXTRA_ARGS: ""
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 600s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2048M
