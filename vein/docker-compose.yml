services:
  vein:
    image: ghcr.io/${IMAGE_OWNER}/vein:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ghcr.io/${IMAGE_OWNER}/steam-base:latest
    pull_policy: missing
    container_name: vein
    restart: unless-stopped
    stop_grace_period: 120s
    init: true
    ports:
      - "7777:7777/udp"
      - "27015:27015/udp"
    volumes:
      - ./data:/opt/vein
    environment:
      STEAM_USERNAME: "${STEAM_USERNAME:-anonymous}"
      STEAM_PASSWORD: "${STEAM_PASSWORD:-}"
      STEAM_GUARD_CODE: "${STEAM_GUARD_CODE:-}"
      VEIN_APP_ID: "2131400"
      VEIN_FORCE_UPDATE: "${VEIN_FORCE_UPDATE:-false}"
      VEIN_PORT: "7777"
      VEIN_QUERY_PORT: "27015"
      VEIN_MAX_PLAYERS: "16"
      VEIN_EXTRA_ARGS: ""
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 900s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    mem_limit: 8192M
