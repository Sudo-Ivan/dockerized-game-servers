services:
  etl:
    image: ghcr.io/${IMAGE_OWNER}/etl:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ghcr.io/${IMAGE_OWNER}/runtime-base:latest
    pull_policy: missing
    container_name: etl
    restart: unless-stopped
    stop_grace_period: 60s
    init: true
    ports:
      - "27960:27960/udp"
      - "27961:27961/udp"
    volumes:
      - ./data:/opt/etl
    environment:
      ETL_PORT: "27960"
      ETL_MAXPLAYERS: "32"
      ETL_STARTMAP: "oasis"
      ETL_GAMETYPE: "4"
      ETL_HOSTNAME: "ET: Legacy Server"
      ETL_EXTRA_ARGS: ""
      ETL_FORCE_UPDATE: "false"
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1024M
