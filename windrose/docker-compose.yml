services:
  windrose:
    image: ghcr.io/${IMAGE_OWNER}/windrose:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ghcr.io/${IMAGE_OWNER}/steam-base:latest
    pull_policy: missing
    container_name: windrose
    restart: unless-stopped
    stop_grace_period: 120s
    init: true
    ports:
      - "7777:7777/tcp"
      - "7777:7777/udp"
    volumes:
      - ./data:/opt/windrose
    environment:
      STEAM_USERNAME: "${STEAM_USERNAME:-anonymous}"
      STEAM_PASSWORD: "${STEAM_PASSWORD:-}"
      STEAM_GUARD_CODE: "${STEAM_GUARD_CODE:-}"
      WINDROSE_APP_ID: "4129620"
      WINDROSE_FORCE_UPDATE: "${WINDROSE_FORCE_UPDATE:-false}"
      WINDROSE_SERVER_NAME: "Windrose Server"
      WINDROSE_DIRECT_PORT: "7777"
      WINDROSE_MAX_PLAYERS: "4"
      WINDROSE_PASSWORD: ""
      WINDROSE_EXTRA_ARGS: ""
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 900s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    mem_limit: 8192M
