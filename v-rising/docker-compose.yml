services:
  v-rising:
    image: ghcr.io/${IMAGE_OWNER}/v-rising:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ghcr.io/${IMAGE_OWNER}/steam-base:latest
    pull_policy: missing
    container_name: v-rising
    restart: unless-stopped
    stop_grace_period: 120s
    init: true
    ports:
      - "9876:9876/udp"
      - "9877:9877/udp"
      - "9877:9877/tcp"
    volumes:
      - ./data:/opt/vrising
    environment:
      STEAM_USERNAME: "${STEAM_USERNAME:-anonymous}"
      STEAM_PASSWORD: "${STEAM_PASSWORD:-}"
      STEAM_GUARD_CODE: "${STEAM_GUARD_CODE:-}"
      VRISING_APP_ID: "1829350"
      VRISING_FORCE_UPDATE: "${VRISING_FORCE_UPDATE:-false}"
      VRISING_PORT: "9876"
      VRISING_QUERY_PORT: "9877"
      VRISING_SERVER_NAME: "V Rising Server"
      VRISING_MAX_PLAYERS: "40"
      VRISING_PASSWORD: ""
      VRISING_SAVE_NAME: "world1"
      VRISING_EXTRA_ARGS: ""
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 900s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    mem_limit: 6144M
